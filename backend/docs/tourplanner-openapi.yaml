openapi: 3.0.3
info:
  title: Tour Planner API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:

  /api/user/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/user/login:
    post:
      summary: Login an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/user/logout:
    post:
      summary: Logout the current user
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { }

  /api/user:
    delete:
      summary: Delete the current user
      security: [ { bearerAuth: [] } ]
      responses:
        '204': { }

  /api/tours:
    get:
      summary: List all tours of the current user
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TourListItemWithFavorite'

    post:
      summary: Create a new tour (backend resolves route)
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'

  /api/tours/{tourId}:
    get:
      summary: Get a specific tour
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourWithFavorite'

    put:
      summary: Update a tour (recomputes route if names or transport changed)
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourCreateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourWithFavorite'

    delete:
      summary: Delete a tour
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      responses:
        '204': { }

  /api/tours/{tourId}/logs:
    get:
      summary: List all tour logs
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TourLog'

    post:
      summary: Add a log entry
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourLogCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourLog'

  /api/tours/{tourId}/logs/{logId}:
    put:
      summary: Update a log entry
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
        - $ref: '#/components/parameters/LogId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourLogUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TourLog'

    delete:
      summary: Delete a log entry
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
        - $ref: '#/components/parameters/LogId'
      responses:
        '204': { }

  /api/tours/{tourId}/route:
    get:
      summary: Get computed route for a tour
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'

  /api/tours/{tourId}/image:
    post:
      summary: Upload or replace the image of a tour
      description: Stores the image on the filesystem and links it to the tour
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '400':
          description: Invalid file
        '404':
          description: Tour not found

    get:
      summary: Get the image of a tour
      description: Returns the stored image file for display in the UI
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      responses:
        '200':
          description: Image file
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found

  /api/users/me/favorites/{tourId}:
    post:
      summary: Add tour to favorites
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      responses:
        '204': { }

    delete:
      summary: Remove tour from favorites
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/TourId'
      responses:
        '204': { }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TourId:
      name: tourId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    ListResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        total: { type: integer }
        page:  { type: integer }
        size:  { type: integer }

    RegisterRequest:
      type: object
      required: [ username, password, email ]
      properties:
        username: { type: string }
        password: { type: string }
        email:    { type: string }

    LoginRequest:
      type: object
      required: [ username, password ]
      properties:
        username: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        id:        { type: string, format: uuid }
        username:  { type: string }
        createdAt: { type: string, format: date-time }
        token:     { type: string }

    LoginResponse:
      type: object
      properties:
        token:     { type: string }
        expiresAt: { type: string, format: date-time }
        sessionId: { type: string, format: uuid }

    Tour:
      type: object
      properties:
        id:            { type: string, format: uuid }
        name:          { type: string }
        description:   { type: string }
        startName:     { type: string }
        endName:       { type: string }
        transportType: { type: string, enum: [CAR, BIKE, FOOT] }
        hasImage:      { type: boolean, description: Indicates if a tour image exists }

    TourWithFavorite:
      allOf:
        - $ref: '#/components/schemas/Tour'
        - type: object
          properties:
            isFavorite:
              type: boolean
              description: Indicates if this tour is a favorite of the current user

    TourCreateRequest:
      type: object
      required: [ name, startName, endName, transportType ]
      properties:
        name:          { type: string }
        description:   { type: string }
        startName:     { type: string }
        endName:       { type: string }
        transportType: { type: string, enum: [CAR, BIKE, FOOT] }

    TourListItemWithFavorite:
      allOf:
        - $ref: '#/components/schemas/TourListItem'
        - type: object
          properties:
            isFavorite:
              type: boolean
              description: Indicates if this tour is a favorite of the current user

    TourListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startName: { type: string }
        endName: { type: string }
        transportType: { type: string }
        hasImage: { type: boolean }

    TourLog:
      type: object
      properties:
        id:       { type: string, format: uuid }
        dateTime: { type: string, format: date-time }
        rating:   { type: integer }
        difficulty: { type: integer }
        totalTime: { type: integer }
        comment:  { type: string }

    TourLogCreateRequest:
      type: object
      required: [ rating ]
      properties:
        dateTime: { type: string, format: date-time }
        rating:   { type: integer }
        comment:  { type: string }

    TourLogUpdateRequest:
      type: object
      properties:
        dateTime: { type: string, format: date-time }
        rating:   { type: integer }
        comment:  { type: string }

    Route:
      type: object
      properties:
        distance: { type: integer, description: meters }
        duration: { type: integer, description: seconds }
        coordinates:
          type: array
          items:
            type: object
            properties:
              lat: { type: number }
              lng: { type: number }

    RouteResponse:
      type: object
      properties:
        distance: { type: integer, description: meters }
        duration: { type: integer, description: seconds }
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/LatLng'

    LatLng:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }

    ImageUploadResponse:
      type: object
      properties:
        hasImage: { type: boolean }