<section class="login-shell">
  <div class="visual-side" aria-hidden="true">
    <div class="visual-side__brand">[Placeholder]</div>
    <div class="visual-side__copy">
      <p>Vienna.</p>
      <p>Dive deep</p>
      <p>Into a new Journey.</p>
    </div>
  </div>

  <p-card class="form-panel">
    <div class="login-card__topbar" aria-hidden="true">
      
    </div>

    <div class="login-card__hero">
      <p class="login-card__eyebrow">Welcome!</p>
      <h1>Create an account with your credentials</h1>
      <p class="login-card__subtitle">
        Set up your profile to continue using our services.
      </p>
    </div>

    <form [formGroup]="loginForm" class="login-form" (ngSubmit)="onSubmit()">
      <div class="field-group">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            class="w-full"
          />
          <label for="email">Email</label>
        </p-floatlabel>
      </div>

      <div class="field-group">
        <p-floatlabel variant="on">
          <p-password
            inputId="password"
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="password">Password</label>
        </p-floatlabel>
      </div>

      <div class="field-group">
        <p-floatlabel variant="on">
          <p-password
            inputId="confirmPassword"
            formControlName="confirmPassword"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          <label for="confirmPassword">Confirm Password</label>
        </p-floatlabel>
      </div>

      <!--<label class="remember-row" for="rememberMe">
        <p-checkbox
          inputId="rememberMe"
          formControlName="rememberMe"
          [binary]="true"
        />
        <span>Remember me</span>
      </label>
      -->
      <p-button
        type="submit"
        label="Sign up"
        styleClass="signup-button"
      />
    </form>

    <p-divider />

    <p class="login-card__footer">
      Already have an account?
      <a href="/">Login</a>
    </p>
  </p-card>
</section>
